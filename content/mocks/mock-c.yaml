diagram: "mock-c"

model_outline: |
  **Requirements.**
  - **Functional:** answer questions, with follow-ups, from four sources; cite the passages used; say so when the documents don't answer.
  - **Quality bar:** at least 90% correct and supported on the eval set; zero answers from documents the asker can't open.
  - **Latency and freshness:** first token within 2 s; edits reflected within 15 minutes, permission changes within 5.
  - **Non-goals:** actions, such as filing tickets, and training a model on the documents.

  Permissions, freshness and a measured quality bar drive the design; raw load doesn't.

  **Estimate.**
  - **Load:** 5,000 users × 6 = 30,000 questions a day ≈ 0.3/s; peak ≈ 1/s.
  - **Tokens per question:** 1,000 of instructions + 5 passages × 500 + 1,500 of history + 100 of question ≈ 5,000 in; ≈ 300 out.
  - **Cost:** 150 M input and 9 M output tokens a day. At illustrative prices ($3 and $15 per million) that's $450 + $135 ≈ $585 a day, and input is ≈ 77% of it.
  - **Answer time:** ≈ 1 s to the first token + 300 tokens ÷ 80 tok/s ≈ 5 s in all, streamed.
  - **Index:** 2 M documents × 5 chunks = 10 M chunks; × 1,024 dimensions × 4 bytes ≈ 40 GB of vectors.
  - **Re-indexing:** 2% of documents a day = 40,000 documents ≈ 200,000 chunks ≈ 2/s.

  **Decision:** one question a second is light, and input dominates the bill, so trim passages and cache the fixed start of the prompt. The index fits on a few machines.

  **Surface and schema.**
  - **Chunk:** text, document ID and version, source, date, and the groups allowed to read it.
  - **Answer:** a short reply, then details, citing passages as [n], streamed with a 400-token cap.

  **High-level design.**
  1. **Indexing:** a connector per source turns edits into change events (webhooks where offered, polling elsewhere). Workers parse each changed document, chunk it into ≈ 500-token passages with a line of document context, embed them in batches, and replace the old chunks in both indexes. A deletion removes its chunks.
  2. **Questions:** look up the user's groups (cached for a minute) and rewrite the question to stand alone. Run hybrid search with the group filter inside both the vector and the keyword search, fuse the rankings, and rerank 50 candidates to 5. If even the best scores too low, say nothing was found.
  3. **Answer:** one call through the AI gateway, which holds a fallback model that passed the same evals.

  **Deep dives.**
  1. **Permissions:** chunks carry group IDs, and membership is looked up at question time, so removing someone from a team takes effect at once, with nothing to re-index. Filtering inside the search fails closed.
  2. **Freshness:** webhooks get lost, so a nightly job compares each source's listing with the index and repairs gaps. Alert on the age of the oldest unindexed change.
  3. **Parsing:** it decides quality more than any model choice. Keep tables whole, run text recognition on scans, and index identical copies once.
  4. **Latency:** groups and rewrite ≈ 0.3 s, search and fusion ≈ 0.1 s, rerank ≈ 0.2 s, first token ≈ 1 s with the cached prefix: ≈ 1.6 s.
  5. **Prompt:** instructions first, identical on every call, then the numbered passages, a summary of older turns, and the question last. Prompt caching cuts that fixed part's cost by about 90%. Code checks that every [n] points to a passage it supplied.
  6. **Evals:** 500 real questions from a pilot, labelled with the documents that answer them, sliced by source, department and language, including must-refuse cases. Recall@5 and citation checks by code (zero tolerance on permissions); correctness by a judge calibrated against 100 human labels; at 500 cases the interval is about ±3.5 points. Run the suite on every change to a prompt, model, chunker or reranker, and on every index rebuild.

  **Pressure-test.**
  - **Injection:** anyone can edit a wiki page, so documents are untrusted. The assistant holds private data, so it gets no way out: no tools that send or browse, and answers render without remote images or links to unknown domains.
  - **Caches:** search results are cached for a few minutes, keyed by the rewritten question and the asker's groups, so a cached answer never crosses an access boundary.
  - **Failure:** the gateway falls back if the provider fails; if search fails, the assistant says so rather than answering without sources.
  - **Abuse and cost:** per-user rate limits and per-department token quotas at the gateway.
  - **Audit and privacy:** each answer's trace records the model and prompt versions, the documents cited and who saw them; personal data is redacted from logs.

  **Evaluate.**

  | Decision | Gain | Cost |
  |---|---|---|
  | Permission filter inside the search | Fails closed; instant revocation | A group lookup on every question |
  | Change events plus a nightly repair job | Fresh within minutes, nothing missed | Two paths to run |
  | Fixed prompt opening | ≈ 90% off that part's input cost | Discipline about prompt order |
  | No tools that can send data out | Injection can't leak data | No actions in the first version |

  - **At 10× the questions:** about $5,850 a day. Pull, in order: prompt caching, a small model for simple lookups, and a semantic cache keyed by permission set.
  - **Sold to many companies:** an index namespace and encryption key per tenant, quotas and chargeback per tenant, and evals per tenant before each release.
  - **“Let it file tickets too?”** One write tool behind approval, then re-check the lethal trifecta: tickets mustn't become a way out.

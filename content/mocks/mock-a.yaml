  - { id: "A04", step: "Estimate", line: "Estimated average and peak send rates (≈ 500/s transactional; a 100 M campaign over an hour ≈ 28,000/s) and used them to size workers and provider quotas", review: "1.5#rules-of-thumb", also: ["1.5#capacity"] }
  - { id: "A05", step: "Estimate", line: "Estimated storage for send records (≈ 150 M sends/day × ~1 KB ≈ 150 GB/day) and set a retention policy", review: "1.5#rules-of-thumb" }
  - { id: "A06", step: "Surface", line: "API takes recipients or a segment, template, data, category, priority and an idempotency key; returns an id; status via lookup or callbacks", review: "2.4#api-design" }
  - { id: "A07", step: "Surface", line: "Data model: preferences and device tokens by user; send records by notification id; dedup keys with a TTL", review: "2.2#data-modelling" }
  - { id: "A08", step: "High-level", line: "End-to-end flow: API → eligibility → queues → channel workers → providers, with delivery status flowing back", review: "1.6#queues" }

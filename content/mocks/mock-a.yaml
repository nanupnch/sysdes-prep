id: "mock-a"
title: "Notification service"
kind: "classic"
minutes: 35
prompt: "Design a notification service that every product team in the company can use to notify our 100 million users."

# Revealed only after the reader has written their own clarifying questions.
clarifications:
  - q: "Which channels?"
    a: "Mobile push, email and SMS. An in-app inbox would be nice but isn't required."
  - q: "Who sends, and what kinds of notification?"
    a: "Internal services call it. Two kinds: transactional (password resets, order updates; one recipient each) and campaigns (one message to millions, a few times a week)."
  - q: "How much traffic?"
    a: "100 million users, 20 million of them active daily. About 50 million transactional notifications a day. A campaign can target all 100 million users."
  - q: "How fast must they arrive?"
    a: "Transactional: handed to the provider within 5 seconds at p99. Campaigns: within an hour."
  - q: "Can a notification be lost or duplicated?"
    a: "Transactional must never be lost. Duplicates are bad but tolerable if rare. Campaigns can be best-effort."
  - q: "What about user preferences?"
    a: "Users opt out per channel and category and set quiet hours in their own time zone. An unsubscribe must take effect immediately; it's a legal requirement."
  - q: "Do we deliver the messages ourselves?"
    a: "No. We call third-party push, email and SMS providers. Each has rate limits and occasional outages."
  - q: "Do teams need tracking?"
    a: "Yes: sent, delivered and opened where the channel reports it, with a dashboard per team."

# Each probe unlocks at its minute. Score the matching rubric line 2 if you had already covered it.
probes:
  - at: 12
    text: "A campaign to all 100 million users starts at 9:00. What happens to a password-reset email requested at 9:01?"
    strong_answer:
      - "Transactional and campaign traffic use separate queues or priority lanes, so the campaign can't delay the reset"
      - "Worker capacity and provider rate limits are reserved for transactional sends"
      - "The campaign is expanded in batches and paced across its hour"
      - "Depth: campaign email goes out from separate IPs or domains, so its sending reputation can't hurt transactional delivery"
  - at: 20
    text: "The SMS provider starts timing out and keeps failing for 10 minutes. Walk me through what your system does."
    strong_answer:
      - "Short timeouts; retries with exponential backoff and jitter, inside a retry budget"
      - "A circuit breaker opens, so workers stop hammering the failing provider"
      - "Messages stay in a durable queue, so nothing is lost; fail over to a second SMS provider, or to push or email if the user allows it"
      - "After recovery, drain the backlog at the provider's rate limit, dead-letter what keeps failing, and alert on queue age"
  - at: 27
    text: "A worker crashes after calling the push provider but before recording the send. What does the user see, and how do you prevent it?"
    strong_answer:
      - "The queue redelivers the message, so the user may get the notification twice (at-least-once delivery)"
      - "Write a dedup record per notification, user and channel before the call, and check it on retry"
      - "Pass an idempotency key to the provider where it supports one"
      - "Exactly-once end to end is impossible; the goal is rare, harmless duplicates"

# Scale: 2 = done unprompted, with a reason · 1 = partly, or only after a probe · 0 = missing.
rubric:
  - { id: "A01", step: "Requirements", line: "Split transactional from campaign traffic, with different latency and delivery guarantees", review: "2.1#senior-signals" }
  - { id: "A02", step: "Requirements", line: "Stated the non-functional requirements: scale, latency per class, no loss for transactional, preference compliance", review: "1.2#reshape", also: ["1.4#consistency"] }

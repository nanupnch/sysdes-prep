  - { id: "A11", step: "Analyse", line: "Checks preferences, quiet hours and unsubscribes at send time, with a preference cache invalidated on change", review: "2.2#cache-patterns" }
  - { id: "A12", step: "Analyse", line: "Idempotency: caller key de-duplicates API retries; per-send dedup record before the provider call; at-least-once queues", review: "2.3#delivery-idempotency" }
  - { id: "A13", step: "Analyse", line: "Per-provider rate limiting (token buckets) and batching where the provider allows it", review: "2.4#overload" }

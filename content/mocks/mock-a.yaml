diagram: "mock-a"

model_outline: |
  **Requirements.** Two classes with different contracts. Transactional notifications have one recipient, must reach the provider within 5 s at p99, and must never be lost. Campaigns reach millions, within an hour, best-effort. Channels are push, email and SMS. Preferences apply per channel and category, with quiet hours, and unsubscribes take effect immediately. Non-goals: template authoring, the in-app inbox, building our own delivery network.

  **Estimate.**
  - **Transactional:** 50 M a day ÷ 10⁵ s ≈ 500/s on average, about 1,500/s at peak.
  - **Campaigns:** one campaign of 100 M over an hour is about 28,000/s. Campaigns, not transactional traffic, set peak capacity.
  - **Storage:** about 150 M sends a day × ~1 KB ≈ 150 GB a day. Keep 30 days hot (≈ 4.5 TB), then archive.
  - **The real bottleneck** is the providers' rate limits, not our servers, so pacing is the design problem.

  **Surface and schema.**
  - **Send:** `POST /notifications` takes recipients or a segment, a template id, data, a category, a priority and an idempotency key. It returns a notification id.
  - **Status:** `GET /notifications/{id}` returns status, and provider webhooks update it.
  - **Stores:**
    - preferences and device tokens, keyed by user and cached;
    - templates;
    - send records, keyed by notification id and partitioned by time;
    - dedup keys with a TTL.

  **High-level design.** The API checks auth and the idempotency key, then appends to a replicated log with separate topics for transactional and campaign traffic. A campaign expander turns a segment into paced batches. Before every send, an eligibility step checks preferences, quiet hours and unsubscribes. Per-channel worker pools call the providers through per-provider rate limiters. Webhooks write delivery status to the send records and an analytics stream.

  **Deep dives.**
  1. **Priority isolation:** separate topics and worker pools, with provider quota reserved for transactional sends.
  2. **Fan-out:** page segments in batches of about 10,000 users, spread them across the window, and delay per time zone for quiet hours.
  3. **Idempotency:** the caller's key de-duplicates API retries. A dedup record per notification, user and channel is written before the provider call. Provider idempotency keys are used where offered.
  4. **Preferences:** read through a cache that is invalidated on change, so an unsubscribe applies within seconds.

  **Pressure-test.**
  - **Provider outage:** timeouts, backoff with jitter, a circuit breaker and a secondary provider. Dead-letter what keeps failing, and drain the backlog at the provider's rate limit.
  - **Overload:** alert on queue age, scale workers on lag, and defer campaigns first.
  - **Failure:** the log is replicated across zones and the workers are stateless, so there's no single point of failure.
  - **Noisy senders:** per-team quotas.
  - **Security:** authenticated callers, per-team permissions on categories, no PII in logs, and an audit trail for unsubscribes.

  **Evaluate.**
  - **Trade-offs:**
    - At-least-once delivery plus dedup, instead of chasing exactly-once.
    - Pacing campaigns trades speed for deliverability and provider limits.
    - One shared service centralises compliance, but needs strong isolation between teams.
  - **SLOs:** p99 time from API to provider hand-off per class, delivery success rate, and how long an unsubscribe takes to apply.

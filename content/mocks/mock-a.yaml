  - { id: "A17", step: "Pressure-test", line: "Noisy senders contained: per-team quotas so one team's burst can't hurt the others", review: "2.4#overload" }
  - { id: "A18", step: "Pressure-test", line: "Security and compliance: authenticated callers, per-team permissions, PII kept out of logs, provable unsubscribe handling", review: "2.4#slos-cost" }
  - { id: "A19", step: "Evaluate", line: "Named the trade-offs (at-least-once + dedup over exactly-once; pacing over speed) and the SLOs (p99 hand-off time per class, delivery success)", review: "2.4#slos-cost" }
  - { id: "A20", step: "Communication", line: "Drove the session: said what came next, checked in, and had a working design by about minute 16", review: "2.1#driving" }

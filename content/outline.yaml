# Structure of the 6-hour guide: three Parts, each a complete loop, as planned in PLAN.md §5.
# Parts → modules → blocks. Review links point here as "<module>#<block>" or "<module>".
# stage: where the module sits in the loop (orient, frame, classic, llm, see, do, check).
# words: teaching-text budget (±10%). tier: 3 = ★★★, 2 = ★★, 1 = ★. facts: root facts 1–7 (PLAN.md §2).
# A module whose text isn't written yet is shown as "being rewritten", with its planned topics.

reading_wpm: 140

parts:
  - id: "1"
    title: "Foundations"
    tagline: "From zero to a complete, simple design"
    minutes: 130
    outcomes:
      - "Explain how a web system and an LLM app work, part by part, in plain words"
      - "Estimate requests, storage and tokens with a few rules of thumb"
      - "Walk a simple design through all seven RESHAPE steps"
    modules:
      - { id: "1.1", minutes: 10, title: "Start here", stage: orient, words: 350, page: home }
      - id: "1.2"
        minutes: 8
        title: "The interview and RESHAPE"
        stage: frame
        words: 650
        diagrams: [reshape-flow]
        blocks:
          - { slug: scoring, title: "What interviewers score", tier: 3, facts: [] }
          - { slug: reshape, title: "The seven steps and their time boxes", tier: 3, facts: [] }
      - id: "1.3"
        minutes: 7
        title: "How a request travels"
        stage: classic
        words: 550
        diagrams: [request-journey]
        blocks:
          - { slug: request-journey, title: "From browser to database and back", tier: 3, facts: [2] }
          - { slug: parts-bin, title: "The parts bin", tier: 2, facts: [1] }
      - id: "1.4"
        minutes: 9
        title: "Root facts and the words for quality"
        stage: classic
        words: 750
        blocks:
          - { slug: root-facts, title: "The seven root facts", tier: 3, facts: [1, 2, 3, 4, 5, 6, 7] }
          - { slug: latency, title: "Latency and percentiles", tier: 3, facts: [2, 5] }
          - { slug: availability, title: "Availability and the nines", tier: 3, facts: [3] }
          - { slug: consistency, title: "Durability and consistency", tier: 3, facts: [3, 4] }
      - id: "1.5"
        minutes: 11
        title: "Estimating in a few minutes"
        stage: classic
        words: 600
        diagrams: [utilisation-wait]
        blocks:
          - { slug: rules-of-thumb, title: "Rules of thumb", tier: 3, facts: [1] }
          - { slug: capacity, title: "Servers, storage and headroom", tier: 3, facts: [1, 5] }
      - id: "1.6"
        minutes: 22
        title: "Classic blocks: the scaling ladder"
        stage: classic
        words: 1900
        diagrams: [two-ladders, lb-stateless, cache-layers]

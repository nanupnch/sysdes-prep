          - { slug: injection, title: "Prompt injection", tier: 3, facts: [7] }
      - id: "1.8"
        minutes: 12
        title: "Worked design: URL shortener"
        stage: see
        words: 1100
        diagrams: [url-v1, url-v2]
        blocks:
          - { slug: requirements, title: "Requirements", tier: 3, facts: [] }
          - { slug: estimate, title: "Estimate", tier: 3, facts: [1] }
          - { slug: design, title: "Version 1, then version 2", tier: 3, facts: [1, 2] }
          - { slug: codes, title: "Short codes and caching", tier: 3, facts: [3, 4] }
          - { slug: trade-offs, title: "Trade-offs taken", tier: 2, facts: [] }
      - id: "1.9"
        minutes: 9
        title: "Worked design: help-centre Q&A"
        stage: see
        words: 900
        diagrams: [help-qa]
        blocks:
          - { slug: requirements, title: "Requirements and the quality bar", tier: 3, facts: [6] }
          - { slug: estimate, title: "Tokens, cost and time", tier: 3, facts: [6] }

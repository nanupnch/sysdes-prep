          - { slug: ladder, title: "One box, then a ladder", tier: 3, facts: [1] }
          - { slug: servers, title: "More servers: load balancers and stateless apps", tier: 3, facts: [1, 3] }
          - { slug: caches, title: "Caches and CDNs", tier: 3, facts: [2] }
          - { slug: databases, title: "Databases and replicas", tier: 3, facts: [4] }
          - { slug: queues, title: "Queues for slow work", tier: 3, facts: [5] }
          - { slug: shards, title: "Shards, last", tier: 3, facts: [1] }
          - { slug: services-regions, title: "Services and regions", tier: 2, facts: [2, 3] }
          - { slug: failure, title: "When parts fail", tier: 3, facts: [3] }
      - id: "1.7"
        minutes: 17
        title: "LLM blocks: the complexity ladder"
        stage: llm
        words: 1500
        diagrams: [llm-call, rag-glance]
        blocks:
          - { slug: model, title: "What a model is", tier: 3, facts: [6] }
          - { slug: tokens, title: "Tokens: cost and speed", tier: 3, facts: [6] }
          - { slug: rag, title: "Retrieval: an open-book exam", tier: 3, facts: [6] }

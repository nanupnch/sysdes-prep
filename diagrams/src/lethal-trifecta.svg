<!-- alt: Three overlapping circles. One is access to private data, such as the inbox, files and customer records. One is exposure to untrusted content, such as emails, web pages and tool results. One is a way to send data out, such as sending email, making web requests, or loading images and links. Where all three overlap, one injected instruction can leak private data. Removing any one circle removes the overlap. -->
<!-- caption: Any two legs are manageable; all three in one agent let a single injected sentence leak your data. Break at least one leg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="760" height="560" fill="#ffffff"/>
<circle cx="300" cy="215" r="120" fill="#fef3c7" fill-opacity="0.75" stroke="#b45309" stroke-width="2"/>
<circle cx="460" cy="215" r="120" fill="#fff1f2" fill-opacity="0.75" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 5"/>
<circle cx="380" cy="340" r="120" fill="#dcfce7" fill-opacity="0.75" stroke="#15803d" stroke-width="2"/>
<text x="170.0" y="52.0" text-anchor="middle" font-size="16" font-weight="700" fill="#18181b">Private data</text>
<text x="170.0" y="72.0" text-anchor="middle" font-size="13" font-weight="400" fill="#3f3f46">inbox · files · customer records</text>
<text x="590.0" y="52.0" text-anchor="middle" font-size="16" font-weight="700" fill="#18181b">Untrusted content</text>
<text x="590.0" y="72.0" text-anchor="middle" font-size="13" font-weight="400" fill="#3f3f46">emails · web pages · tool results</text>
<text x="380.0" y="494.0" text-anchor="middle" font-size="16" font-weight="700" fill="#18181b">A way out</text>
<text x="380.0" y="514.0" text-anchor="middle" font-size="13" font-weight="400" fill="#3f3f46">send email · web requests · images</text>
<line x1="200" y1="78" x2="245" y2="118" stroke="#52525b" stroke-width="1"/>
<line x1="560" y1="78" x2="515" y2="118" stroke="#52525b" stroke-width="1"/>
<line x1="380" y1="476" x2="380" y2="455" stroke="#52525b" stroke-width="1"/>
<circle cx="380" cy="252" r="32" fill="#dc2626" fill-opacity="0.92"/>
<text x="380.0" y="248.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">leak</text>
<text x="380.0" y="266.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">risk</text>
<text x="380.0" y="545.0" text-anchor="middle" font-size="14" font-weight="600" fill="#18181b">Break one leg: least privilege · approvals · allow-lists · split the work · sandbox</text>
</svg>

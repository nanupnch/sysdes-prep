<!-- alt: A timeline with four lanes: client 1, a lock service, client 2 and storage. Client 1 asks for a lease and gets token 33, then pauses, for example for garbage collection. While it is paused, its lease ends; client 2 asks for a lease and gets token 34, writes to storage with token 34, and storage records 34 as the highest token it has seen. Client 1 wakes, unaware, and writes with token 33; storage rejects the write because 33 is lower than 34. -->
<!-- caption: A paused leader wakes still believing it holds the lease. The fencing token lets storage decide instead: any write with a lower token than one already seen is refused. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 372" width="380" height="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs>
<marker id="ft-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker>
<marker id="ft-arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="ft-arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker>
</defs>
<rect x="0" y="0" width="380" height="372" fill="#ffffff"/>
<g stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4">
<line x1="48" y1="38" x2="48" y2="360"/>
<line x1="143" y1="38" x2="143" y2="360"/>
<line x1="238" y1="38" x2="238" y2="360"/>
<line x1="333" y1="38" x2="333" y2="360"/>
</g>
<g fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5">
<rect x="4" y="6" width="88" height="30" rx="6"/>
<rect x="99" y="6" width="88" height="30" rx="6"/>
<rect x="194" y="6" width="88" height="30" rx="6"/>
<rect x="289" y="6" width="88" height="30" rx="6"/>
</g>
<g font-size="13" font-weight="700" fill="#14123d" text-anchor="middle">
<text x="48" y="26">Client 1</text>
<text x="143" y="26">Lock service</text>
<text x="238" y="26">Client 2</text>
<text x="333" y="26">Storage</text>
</g>
<rect x="42" y="104" width="12" height="166" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="60" y="184" font-size="13" font-weight="700" fill="#b45309">paused</text>
<text x="60" y="201" font-size="13" fill="#b45309">(GC, VM)</text>
<g stroke="#52525b" stroke-width="1.5" fill="none">
<line x1="52" y1="64" x2="139" y2="64" marker-end="url(#ft-arr)"/>
<line x1="139" y1="92" x2="52" y2="92" stroke-dasharray="5 3" marker-end="url(#ft-arr)"/>
<line x1="234" y1="160" x2="147" y2="160" marker-end="url(#ft-arr)"/>
<line x1="147" y1="188" x2="234" y2="188" stroke-dasharray="5 3" marker-end="url(#ft-arr)"/>
<line x1="242" y1="222" x2="329" y2="222" marker-end="url(#ft-arr)"/>
<line x1="52" y1="302" x2="329" y2="302" marker-end="url(#ft-arr)"/>
</g>
<line x1="329" y1="248" x2="242" y2="248" stroke="#15803d" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ft-arr-green)"/>
<line x1="329" y1="334" x2="52" y2="334" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ft-arr-red)"/>
<g font-size="13" fill="#18181b" text-anchor="middle">
<text x="95" y="58">lease?</text>
<text x="95" y="86">token 33</text>
<text x="190" y="154">lease?</text>
<text x="190" y="182">token 34</text>
<text x="285" y="216">write, 34</text>
<text x="190" y="296">write, token 33</text>
</g>
<text x="285" y="242" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">ok</text>
<text x="190" y="328" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">rejected: 33 &lt; 34</text>
<rect x="95" y="114" width="96" height="24" rx="5" fill="#fff1f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="143" y="131" font-size="13" fill="#7f1d1d" text-anchor="middle">lease 33 ends</text>
<rect x="291" y="258" width="84" height="24" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="333" y="275" font-size="13" fill="#14532d" text-anchor="middle">highest: 34</text>
</svg>

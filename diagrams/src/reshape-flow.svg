<!-- alt: A 35-minute timeline split into the seven RESHAPE steps, in order: Requirements, 4 minutes; Estimate, 3; Surface and schema, 3; High-level design, 6; Analyse, 12; Pressure-test, 5; Evaluate, 2. A marker at minute 16 shows when a working end-to-end design should exist. Analyse, the longest step, follows it. -->

<!-- alt: A timeline of one model call, from 0 to 6 seconds. Prefill processes the whole 7,000-token prompt at once and ends at about 0.5 seconds, when the first token appears. Decode then writes the 400-token answer one token at a time, at about 80 tokens a second, finishing at about 5.5 seconds. The total is the time to first token plus output tokens divided by tokens per second. -->
<!-- caption: Prefill is short and parallel; decode is long and serial. Output length, not prompt length, sets most of the wait. -->

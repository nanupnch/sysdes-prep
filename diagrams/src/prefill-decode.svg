<text x="530.0" y="256.0" text-anchor="middle" font-size="14" font-weight="400" fill="#3f3f46">4 s</text>
<line x1="625.0" y1="227" x2="625.0" y2="237" stroke="#52525b" stroke-width="1.5"/>
<text x="625.0" y="256.0" text-anchor="middle" font-size="14" font-weight="400" fill="#3f3f46">5 s</text>
<line x1="720.0" y1="227" x2="720.0" y2="237" stroke="#52525b" stroke-width="1.5"/>

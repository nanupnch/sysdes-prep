<!-- alt: Five workflow patterns. Chaining: input, a first model call, a check, a second model call, output. Routing: a router sends the input to one of three specialised model calls. Parallelising: three model calls run at once on the same input, and their results are combined. Orchestrator and workers: an orchestrator model plans sub-tasks at run time, workers handle them, and a final call merges the results. Evaluator and optimiser: a generator drafts, an evaluator critiques, and the draft loops back until it passes. -->
<!-- caption: All five are ordinary code with model calls inside: your code, not the model, fixes the order of the steps. -->

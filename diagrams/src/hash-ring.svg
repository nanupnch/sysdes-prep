<circle cx="566.6" cy="95.3" r="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="566.6" y="100.3" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">A</text>
<circle cx="647.2" cy="119.2" r="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="647.2" y="124.2" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">B</text>
<circle cx="674.5" cy="147.9" r="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="674.5" y="152.9" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">C</text>
<circle cx="694.1" cy="229.6" r="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="694.1" y="234.6" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">A</text>
<circle cx="682.9" cy="267.6" r="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="682.9" y="272.6" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">C</text>
<circle cx="621.9" cy="325.5" r="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="621.9" y="330.5" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">B</text>
<circle cx="583.4" cy="334.7" r="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="583.4" y="339.7" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">A</text>
<circle cx="502.8" cy="310.8" r="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="502.8" y="315.8" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">B</text>
<circle cx="475.5" cy="282.1" r="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="475.5" y="287.1" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">C</text>
<circle cx="455.9" cy="200.4" r="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="455.9" y="205.4" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">B</text>
<circle cx="467.1" cy="162.4" r="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="467.1" y="167.4" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">A</text>
<circle cx="528.1" cy="104.5" r="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="528.1" y="109.5" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">C</text>
<text x="575" y="209" text-anchor="middle" font-size="15" fill="#3f3f46">Many small slices</text>
<text x="575" y="228" text-anchor="middle" font-size="15" fill="#3f3f46">per server</text>
</svg>
